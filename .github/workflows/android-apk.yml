name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystery-merge-android
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android export dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Configure Godot Android SDK paths and debug keystore
        run: |
          mkdir -p ~/.config/godot ~/.android build
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          python3 - "$HOME/.android/debug.keystore" <<'PY'
          from pathlib import Path
          import sys
          preset = Path("export_presets.cfg")
          content = preset.read_text(encoding="utf-8")
          content = content.replace('keystore/debug=""', f'keystore/debug="{sys.argv[1]}"')
          content = content.replace('keystore/debug_user=""', 'keystore/debug_user="androiddebugkey"')
          content = content.replace('keystore/debug_password=""', 'keystore/debug_password="android"')
          if 'keystore/debug=""' in content or 'keystore/debug_user=""' in content or 'keystore/debug_password=""' in content:
              raise SystemExit("Could not configure the Android debug keystore in export_presets.cfg")
          preset.write_text(content, encoding="utf-8")
          PY

      - name: Validate game data
        run: python3 tests/validate_game_data.py

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Smoke-run the main game and merge board
        run: |
          godot --headless --path . --quit-after 90
          godot --headless --path . --quit-after 90 res://scenes/MergeBoard.tscn

      - name: Diagnose Android export configuration
        run: |
          echo "Export template directory:"
          find "$HOME/.local/share/godot/export_templates/4.3.stable" -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          echo "Android SDK components:"
          ls -1 "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/build-tools"
          ls -1 "$ANDROID_HOME/ndk"
          echo "Command-line tools:"
          ls -lah "$ANDROID_HOME/cmdline-tools/latest"
          echo "Debug signing configuration:"
          grep -E 'keystore/debug|package/unique_name|package/signed' export_presets.cfg
          echo "Godot version:"
          godot --version

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/MysteryMerge-debug.apk 2>&1 | tee build/android-export.log
          test -s build/MysteryMerge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MysteryMerge-debug-apk
          path: build/MysteryMerge-debug.apk
          if-no-files-found: error
          retention-days: 14
